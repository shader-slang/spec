<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="820" viewBox="0 0 1180 820" role="img" aria-label="Metal tag reachability problem for Slang AnyHit and Intersection lowering">
  <style>
    .title { font: 700 22px sans-serif; fill: #202020; }
    .subtitle { font: 700 16px sans-serif; fill: #202020; }
    .label { font: 700 14px sans-serif; fill: #202020; }
    .small { font: 12px sans-serif; fill: #333333; }
    .tiny { font: 11px sans-serif; fill: #333333; }
    .code { font: 12px monospace; fill: #202020; }
    .panel { fill: #fbfbfb; stroke: #c7c7c7; stroke-width: 1.5; rx: 10; }
    .metal { fill: #fffaf2; stroke: #a65f00; stroke-width: 1.5; rx: 7; }
    .trace { fill: #f8fbff; stroke: #336699; stroke-width: 1.5; rx: 7; }
    .stage { fill: #fffaf2; stroke: #a65f00; stroke-width: 1.5; rx: 7; }
    .host { fill: #f3fff6; stroke: #2f7d45; stroke-width: 1.5; rx: 7; }
    .compile { fill: #f7f3ff; stroke: #6d4db3; stroke-width: 1.5; rx: 7; }
    .warn { fill: #ffe4e0; stroke: #b42318; stroke-width: 2.4; rx: 8; }
    .ok { fill: #eaf7ef; stroke: #2f7d45; stroke-width: 2; rx: 8; }
    .arrow { stroke: #333333; stroke-width: 1.7; marker-end: url(#arrow); fill: none; }
    .greenArrow { stroke: #2f7d45; stroke-width: 1.8; marker-end: url(#arrowGreen); fill: none; }
    .redArrow { stroke: #b42318; stroke-width: 2.1; marker-end: url(#arrowRed); fill: none; }
    .purpleArrow { stroke: #6d4db3; stroke-width: 1.8; marker-end: url(#arrowPurple); fill: none; }
    .dash { stroke: #777777; stroke-width: 1.5; stroke-dasharray: 5 4; marker-end: url(#arrow); fill: none; }
    .redText { font: 700 14px sans-serif; fill: #8a1f17; }
    .greenText { font: 700 14px sans-serif; fill: #276738; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333333"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2f7d45"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#b42318"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#6d4db3"/>
    </marker>
  </defs>

  <text x="36" y="38" class="title">Metal tag-list reachability problem</text>
  <text x="36" y="62" class="small">Metal custom intersection functions are tagged in source. Slang must synthesize those tags,</text>
  <text x="36" y="80" class="small">but old-style pipeline shaders do not say which trace can reach which AnyHit or Intersection entry point.</text>

  <rect x="36" y="100" width="1108" height="285" class="panel"/>
  <text x="58" y="130" class="subtitle">Native Metal: tags are explicit, so pipeline-build validation has enough information</text>

  <rect x="65" y="157" width="245" height="96" class="metal"/>
  <text x="86" y="183" class="label">Metal shader source</text>
  <text x="86" y="208" class="code">intersector&lt;TagA&gt; tracerA;</text>
  <text x="86" y="230" class="code">intersector&lt;TagB&gt; tracerB;</text>

  <rect x="355" y="144" width="285" height="122" class="stage"/>
  <text x="377" y="170" class="label">Tagged intersection functions</text>
  <text x="377" y="196" class="code">[[intersection(TagA)]] fA()</text>
  <text x="377" y="218" class="code">[[intersection(TagB)]] fB()</text>
  <text x="377" y="240" class="code">[[intersection(TagB)]] fC()</text>

  <rect x="690" y="145" width="190" height="118" class="host"/>
  <text x="722" y="171" class="label">Host bindings</text>
  <text x="713" y="196" class="small">tracerA slot 0 -> fA</text>
  <text x="713" y="218" class="small">tracerA slot 1 -> fB</text>
  <text x="713" y="240" class="redText">mismatch</text>

  <rect x="925" y="145" width="180" height="118" class="ok"/>
  <text x="954" y="172" class="greenText">Pipeline build</text>
  <text x="948" y="200" class="small">sees tracer tags,</text>
  <text x="948" y="221" class="small">function tags,</text>
  <text x="948" y="242" class="small">and bindings</text>

  <path d="M310 205 L355 205" class="arrow"/>
  <path d="M640 205 L690 205" class="greenArrow"/>
  <path d="M880 205 L925 205" class="greenArrow"/>

  <rect x="190" y="305" width="790" height="56" class="ok"/>
  <text x="218" y="329" class="greenText">Mismatch is late but detectable:</text>
  <text x="218" y="348" class="small">pipeline build can reject tracerA -> fB because both sides already carry concrete Metal tags.</text>

  <rect x="36" y="402" width="1108" height="380" class="panel"/>
  <text x="58" y="432" class="subtitle">Existing Slang model: the compiler must emit Metal tags before host bindings are known</text>

  <rect x="65" y="465" width="250" height="132" class="trace"/>
  <text x="88" y="492" class="label">Ray-generation code</text>
  <text x="88" y="520" class="code">intersector1.intersect(...)</text>
  <text x="88" y="541" class="small">needs Metal tag set A</text>
  <text x="88" y="570" class="code">intersector2.intersect(...)</text>
  <text x="88" y="591" class="small">needs Metal tag set B</text>

  <rect x="365" y="452" width="245" height="160" class="stage"/>
  <text x="388" y="479" class="label">Independent stage entries</text>
  <text x="388" y="506" class="code">AnyHit1()</text>
  <text x="388" y="526" class="code">AnyHit2()</text>
  <text x="388" y="546" class="code">AnyHit3()</text>
  <text x="388" y="574" class="code">Intersection1()</text>
  <text x="388" y="594" class="code">Intersection2()</text>

  <rect x="660" y="458" width="210" height="148" class="compile"/>
  <text x="691" y="485" class="label">Slang Metal codegen</text>
  <text x="684" y="515" class="small">must emit:</text>
  <text x="684" y="541" class="code">[[intersection(?)]]</text>
  <text x="684" y="563" class="code">generatedAnyHit()</text>
  <text x="684" y="590" class="redText">Which tag set?</text>

  <rect x="920" y="458" width="185" height="148" class="host"/>
  <text x="948" y="485" class="label">Host bindings</text>
  <text x="943" y="515" class="small">slot tables decide:</text>
  <text x="943" y="540" class="small">A -> Intersection2</text>
  <text x="943" y="562" class="small">B -> AnyHit1</text>
  <text x="943" y="587" class="redText">Available later</text>

  <path d="M315 531 L365 531" class="dash"/>
  <path d="M610 532 L660 532" class="purpleArrow"/>
  <path d="M920 532 C900 532 890 532 870 532" class="redArrow"/>
  <text x="880" y="521" class="redText">too late</text>

  <rect x="165" y="650" width="860" height="96" class="warn"/>
  <text x="190" y="680" class="redText">Core problem:</text>
  <text x="310" y="680" class="small">Slang sees trace sites and stage entry points, but not the host binding edges that connect them.</text>
  <text x="310" y="704" class="small">Without a source-level reachability contract, it cannot know whether each generated</text>
  <text x="310" y="724" class="small">AnyHit/Intersection function needs tag set A, tag set B, or another tag set.</text>

  <path d="M488 612 C492 628 520 641 560 650" class="redArrow"/>
  <path d="M765 606 C760 626 735 641 700 650" class="redArrow"/>
  <path d="M1012 606 C1000 636 955 648 900 650" class="redArrow"/>
</svg>

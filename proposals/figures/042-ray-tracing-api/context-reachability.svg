<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-label="Context connects ray tracer and hit shaders">
  <style>
    .title { font: 700 18px sans-serif; fill: #202020; }
    .label { font: 14px sans-serif; fill: #202020; }
    .small { font: 12px sans-serif; fill: #333333; }
    .box { fill: #f8fbff; stroke: #336699; stroke-width: 1.5; rx: 7; }
    .group { fill: #f3fff6; stroke: #2f7d45; stroke-width: 1.5; rx: 7; }
    .stage { fill: #fffaf2; stroke: #a65f00; stroke-width: 1.5; rx: 7; }
    .arrow { stroke: #333333; stroke-width: 1.8; marker-end: url(#arrow4); fill: none; }
  </style>
  <defs>
    <marker id="arrow4" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333333"/>
    </marker>
  </defs>

  <text x="35" y="35" class="title">Context makes reachability explicit</text>

  <rect x="45" y="90" width="190" height="65" class="box"/>
  <text x="83" y="118" class="label">RayTracer</text>
  <text x="66" y="139" class="small">RayTracer&lt;ProgramLayout&gt;</text>

  <rect x="310" y="70" width="230" height="105" class="group"/>
  <text x="333" y="100" class="label">PrimaryTraceProgramLayout</text>
  <text x="342" y="125" class="small">TraceContext = PrimaryTraceContext</text>
  <text x="342" y="148" class="small">HitGroups = ordered group list</text>

  <rect x="615" y="40" width="220" height="55" class="stage"/>
  <text x="647" y="68" class="label">ClosestHitInput</text>
  <text x="647" y="86" class="small">PrimaryTriangleContext</text>

  <rect x="615" y="120" width="220" height="55" class="stage"/>
  <text x="665" y="148" class="label">AnyHitInput</text>
  <text x="647" y="166" class="small">PrimaryTriangleContext</text>

  <rect x="615" y="200" width="220" height="55" class="stage"/>
  <text x="656" y="228" class="label">IntersectionInput</text>
  <text x="647" y="246" class="small">PrimaryTriangleContext</text>

  <path d="M235 122 L310 122" class="arrow"/>
  <path d="M540 112 C575 92 585 68 615 68" class="arrow"/>
  <path d="M540 122 L615 148" class="arrow"/>
  <path d="M540 134 C575 168 585 228 615 228" class="arrow"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-label="API overview">
  <style>
    .title { font: 700 18px sans-serif; fill: #202020; }
    .label { font: 14px sans-serif; fill: #202020; }
    .small { font: 12px sans-serif; fill: #333333; }
    .box { fill: #f8fbff; stroke: #336699; stroke-width: 1.5; rx: 7; }
    .group { fill: #f3fff6; stroke: #2f7d45; stroke-width: 1.5; rx: 7; }
    .target { fill: #fffaf2; stroke: #a65f00; stroke-width: 1.5; rx: 7; }
    .arrow { stroke: #333333; stroke-width: 1.8; marker-end: url(#arrow3); fill: none; }
  </style>
  <defs>
    <marker id="arrow3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333333"/>
    </marker>
  </defs>

  <text x="35" y="35" class="title">Proposed Slang source structure</text>

  <rect x="50" y="70" width="190" height="65" class="box"/>
  <text x="76" y="98" class="label">Trace context</text>
  <text x="75" y="119" class="small">payload, AS kind, tags</text>

  <rect x="50" y="165" width="190" height="65" class="box"/>
  <text x="74" y="193" class="label">Stage structs</text>
  <text x="73" y="214" class="small">operator() implements logic</text>

  <rect x="305" y="95" width="250" height="115" class="group"/>
  <text x="366" y="125" class="label">TraceProgram</text>
  <text x="333" y="150" class="small">MissGroupList&lt;...&gt;</text>
  <text x="333" y="173" class="small">HitGroupList&lt;Slot0, Slot1, ...&gt;</text>
  <text x="333" y="196" class="small">reflection-friendly conceptual SBT</text>

  <rect x="620" y="55" width="220" height="65" class="target"/>
  <text x="665" y="83" class="label">D3D / Vulkan</text>
  <text x="650" y="104" class="small">native SBT and pipeline stages</text>

  <rect x="620" y="170" width="220" height="65" class="target"/>
  <text x="692" y="198" class="label">Metal</text>
  <text x="651" y="219" class="small">generated post-trace dispatch</text>

  <rect x="305" y="260" width="250" height="55" class="box"/>
  <text x="349" y="293" class="label">RayTracer&lt;TraceProgram&gt;.trace</text>

  <path d="M240 103 L305 135" class="arrow"/>
  <path d="M240 198 L305 175" class="arrow"/>
  <path d="M555 145 C590 115 590 88 620 88" class="arrow"/>
  <path d="M555 165 C590 180 590 202 620 202" class="arrow"/>
  <path d="M430 210 L430 260" class="arrow"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="560" viewBox="0 0 1180 560" role="img" aria-label="Metal function buffer compared with D3D and Vulkan shader binding table">
  <style>
    .title { font: 700 20px sans-serif; fill: #202020; }
    .panelTitle { font: 700 16px sans-serif; fill: #202020; }
    .label { font: 700 13px sans-serif; fill: #202020; }
    .small { font: 12px sans-serif; fill: #333333; }
    .tiny { font: 11px sans-serif; fill: #333333; }
    .caption { font: 700 13px sans-serif; fill: #202020; }
    .panel { fill: #ffffff; stroke: #777777; stroke-width: 1.5; rx: 8; }
    .metalTable { fill: #f8fbff; stroke: #336699; stroke-width: 2; rx: 7; }
    .userData { fill: #f3fff6; stroke: #2f7d45; stroke-width: 2; rx: 7; }
    .sbt { fill: #ffffff; stroke: #555555; stroke-width: 2; rx: 8; }
    .hit { fill: #f8fbff; stroke: #336699; stroke-width: 1.5; rx: 6; }
    .miss { fill: #fffaf2; stroke: #a65f00; stroke-width: 1.5; rx: 6; }
    .call { fill: #f3fff6; stroke: #2f7d45; stroke-width: 1.5; rx: 6; }
    .note { fill: #fffaf2; stroke: #a65f00; stroke-width: 1.5; rx: 7; }
    .header { fill: #e9f2ff; stroke: #667788; stroke-width: 1; }
    .cell { fill: #ffffff; stroke: #667788; stroke-width: 1; }
    .highlight { fill: #ffe8e5; stroke: #b42318; stroke-width: 2; }
    .redNote { font: 700 12px sans-serif; fill: #8a1f17; }
    .arrow { stroke: #333333; stroke-width: 1.8; marker-end: url(#arrow); fill: none; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333333"/>
    </marker>
  </defs>

  <text x="34" y="38" class="title">Function-buffer resource vs. native SBT layout</text>

  <rect x="30" y="62" width="545" height="440" class="panel"/>
  <text x="55" y="92" class="panelTitle">Metal path</text>
  <text x="55" y="114" class="small">Shader-visible function buffer plus user data.</text>

  <rect x="55" y="142" width="310" height="235" class="metalTable"/>
  <text x="78" y="169" class="label">function-buffer table: m x n</text>

  <rect x="78" y="194" width="58" height="28" class="header"/>
  <text x="91" y="212" class="tiny">row/col</text>
  <rect x="136" y="194" width="65" height="28" class="header"/>
  <text x="153" y="212" class="tiny">slot 0</text>
  <rect x="201" y="194" width="65" height="28" class="header"/>
  <text x="218" y="212" class="tiny">slot 1</text>
  <rect x="266" y="194" width="65" height="28" class="header"/>
  <text x="283" y="212" class="tiny">slot 2</text>
  <rect x="331" y="194" width="24" height="28" class="header"/>
  <text x="337" y="212" class="tiny">...</text>

  <rect x="78" y="222" width="58" height="44" class="header"/>
  <text x="94" y="249" class="tiny">row 0</text>
  <rect x="136" y="222" width="65" height="44" class="cell"/>
  <text x="141" y="249" class="tiny">Intersection</text>
  <rect x="201" y="222" width="65" height="44" class="cell"/>
  <text x="206" y="249" class="tiny">Intersection</text>
  <rect x="266" y="222" width="65" height="44" class="cell"/>
  <text x="271" y="249" class="tiny">Intersection</text>
  <rect x="331" y="222" width="24" height="44" class="cell"/>
  <text x="337" y="249" class="tiny">...</text>

  <rect x="78" y="266" width="58" height="44" class="header"/>
  <text x="94" y="293" class="tiny">row 1</text>
  <rect x="136" y="266" width="65" height="44" class="cell"/>
  <text x="141" y="293" class="tiny">Intersection</text>
  <rect x="201" y="266" width="65" height="44" class="highlight"/>
  <text x="206" y="293" class="tiny">Intersection</text>
  <rect x="266" y="266" width="65" height="44" class="cell"/>
  <text x="271" y="293" class="tiny">Intersection</text>
  <rect x="331" y="266" width="24" height="44" class="cell"/>
  <text x="337" y="293" class="tiny">...</text>

  <rect x="78" y="310" width="58" height="24" class="header"/>
  <text x="100" y="326" class="tiny">...</text>
  <rect x="136" y="310" width="65" height="24" class="cell"/>
  <text x="163" y="326" class="tiny">...</text>
  <rect x="201" y="310" width="65" height="24" class="cell"/>
  <text x="228" y="326" class="tiny">...</text>
  <rect x="266" y="310" width="65" height="24" class="cell"/>
  <text x="293" y="326" class="tiny">...</text>
  <rect x="331" y="310" width="24" height="24" class="cell"/>
  <text x="337" y="326" class="tiny">...</text>

  <path d="M365 258 L395 258" class="arrow"/>

  <rect x="398" y="142" width="140" height="235" class="userData"/>
  <text x="420" y="169" class="label">user_data</text>
  <text x="420" y="204" class="small">records</text>
  <text x="420" y="229" class="small">bindless buffers</text>
  <text x="420" y="254" class="small">callable tables</text>
  <text x="420" y="279" class="small">slot maps</text>

  <rect x="84" y="397" width="410" height="52" class="note"/>
  <text x="104" y="420" class="label">Not in this table</text>
  <text x="104" y="440" class="small">ClosestHit and Miss are post-trace shader logic on Metal.</text>

  <text x="55" y="480" class="caption">(a) Metal: function buffer entries contain one custom intersection function.</text>

  <rect x="605" y="62" width="545" height="440" class="panel"/>
  <text x="630" y="92" class="panelTitle">D3D / Vulkan path</text>
  <text x="630" y="114" class="small">Host-side SBT object, not a shader-visible resource.</text>

  <rect x="630" y="142" width="490" height="275" class="sbt"/>
  <text x="655" y="169" class="label">Shader Binding Table</text>
  <text x="805" y="169" class="redNote">no shader binding point</text>

  <rect x="655" y="190" width="305" height="170" class="hit"/>
  <text x="674" y="216" class="label">hit-group section: m x n</text>

  <rect x="674" y="235" width="52" height="26" class="header"/>
  <text x="687" y="252" class="tiny">row/col</text>
  <rect x="726" y="235" width="66" height="26" class="header"/>
  <text x="744" y="252" class="tiny">slot 0</text>
  <rect x="792" y="235" width="66" height="26" class="header"/>
  <text x="810" y="252" class="tiny">slot 1</text>
  <rect x="858" y="235" width="66" height="26" class="header"/>
  <text x="876" y="252" class="tiny">slot 2</text>
  <rect x="924" y="235" width="24" height="26" class="header"/>
  <text x="930" y="252" class="tiny">...</text>

  <rect x="674" y="261" width="52" height="43" class="header"/>
  <text x="688" y="287" class="tiny">row 0</text>
  <rect x="726" y="261" width="66" height="43" class="cell"/>
  <text x="730" y="275" class="tiny">ClosestHit</text>
  <text x="738" y="289" class="tiny">AnyHit</text>
  <text x="728" y="302" class="tiny">Intersection</text>
  <rect x="792" y="261" width="66" height="43" class="cell"/>
  <text x="796" y="275" class="tiny">ClosestHit</text>
  <text x="804" y="289" class="tiny">AnyHit</text>
  <text x="794" y="302" class="tiny">Intersection</text>
  <rect x="858" y="261" width="66" height="43" class="cell"/>
  <text x="862" y="275" class="tiny">ClosestHit</text>
  <text x="870" y="289" class="tiny">AnyHit</text>
  <text x="860" y="302" class="tiny">Intersection</text>
  <rect x="924" y="261" width="24" height="43" class="cell"/>
  <text x="930" y="287" class="tiny">...</text>

  <rect x="674" y="304" width="52" height="43" class="header"/>
  <text x="688" y="330" class="tiny">row 1</text>
  <rect x="726" y="304" width="66" height="43" class="cell"/>
  <text x="730" y="318" class="tiny">ClosestHit</text>
  <text x="738" y="332" class="tiny">AnyHit</text>
  <text x="728" y="345" class="tiny">Intersection</text>
  <rect x="792" y="304" width="66" height="43" class="highlight"/>
  <text x="796" y="318" class="tiny">ClosestHit</text>
  <text x="804" y="332" class="tiny">AnyHit</text>
  <text x="794" y="345" class="tiny">Intersection</text>
  <rect x="858" y="304" width="66" height="43" class="cell"/>
  <text x="862" y="318" class="tiny">ClosestHit</text>
  <text x="870" y="332" class="tiny">AnyHit</text>
  <text x="860" y="345" class="tiny">Intersection</text>
  <rect x="924" y="304" width="24" height="43" class="cell"/>
  <text x="930" y="330" class="tiny">...</text>

  <rect x="970" y="190" width="120" height="80" class="miss"/>
  <text x="990" y="215" class="label">miss section</text>
  <rect x="998" y="228" width="64" height="18" class="cell"/>
  <text x="1014" y="241" class="tiny">Miss0</text>
  <rect x="998" y="246" width="64" height="18" class="cell"/>
  <text x="1025" y="259" class="tiny">...</text>

  <rect x="970" y="286" width="120" height="80" class="call"/>
  <text x="988" y="311" class="label">callable section</text>
  <rect x="998" y="324" width="64" height="18" class="cell"/>
  <text x="1015" y="337" class="tiny">Call0</text>
  <rect x="998" y="342" width="64" height="18" class="cell"/>
  <text x="1025" y="355" class="tiny">...</text>

  <text x="630" y="480" class="caption">(b) D3D/Vulkan: SBT records group hit shaders and live only on the host side.</text>
</svg>
